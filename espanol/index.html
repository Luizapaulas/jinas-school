<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/config.js"></script>
<script src="../assets/auth.js"></script>
<script src="../assets/claude-shim.js" data-site="espanol"></script>
<style>#logout,[data-stpass]{display:none!important}</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Español con School · Plataforma Jinas School (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;600&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>:root{--red:#FB452F;--or:#FF874A;--deep:#AA151B;--gold:#FFC400;--ink:#2B1B17;--cream:#FFF8F2;--line:#F0DCCB;--mut:#7A665C;--side:250px}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--cream);line-height:1.55;font-size:15.5px}
h1,h2,h3,h4{font-family:"Poppins",sans-serif;line-height:1.2;margin:.2em 0 .5em}
h1.pt{font-size:30px;margin:6px 0 14px}
h2{font-size:21px}h3{font-size:17px}
a{color:var(--deep)}
.hidden{display:none!important}
.small{font-size:13px;color:var(--mut)}
.lead{font-size:16px;color:var(--mut);max-width:760px}
#side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--ink);color:#fff;display:flex;flex-direction:column;z-index:20;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand img{width:48px;background:#fff;border-radius:12px;padding:3px}
.brand b{display:block;font-family:Poppins;font-weight:500;font-size:13px;opacity:.8}
.brand span{font-family:Poppins;font-weight:800;font-size:22px;color:var(--gold);line-height:1}
#side nav{padding:8px;display:flex;flex-direction:column;gap:2px}
#side nav a{color:#f3e7df;text-decoration:none;padding:9px 12px;border-radius:10px;display:flex;gap:10px;font-size:14.5px}
#side nav a:hover{background:rgba(255,255,255,.08)}
#side nav a.act{background:linear-gradient(90deg,var(--red),var(--or));color:#fff;font-weight:600}
.side-foot{margin-top:auto;padding:14px 16px;font-size:12px;opacity:.75}
.side-foot a{color:var(--gold)}
#top{position:sticky;top:0;margin-left:var(--side);display:flex;align-items:center;gap:12px;padding:10px 24px;background:rgba(255,248,242,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);z-index:10}
#menu{display:none;border:0;background:none;font-size:24px;cursor:pointer}
.levels{display:flex;gap:6px}
.lv{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-family:Poppins;font-weight:600;cursor:pointer;color:var(--ink)}
.lv.act{background:var(--red);border-color:var(--red);color:#fff}
.lv.lock{opacity:.5}
.who{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.chip.t{background:var(--gold);border-color:var(--gold)}
.chip.g{color:var(--mut)}
#main{margin-left:var(--side);padding:22px 28px 60px;max-width:calc(1180px + var(--side))}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:18px;box-shadow:0 2px 10px rgba(80,30,10,.04)}
.card.tint{background:#FFF1E6;border-color:#FBD9C2}
.card.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.card.fe{background:#FCEEEE;border-color:#F2C9C9}
.card.center{text-align:center}
.card.narrow{max-width:560px;margin:30px auto}
.card.link{text-decoration:none;color:inherit;transition:.15s}.card.link:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(80,30,10,.1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid-side{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.btn{display:inline-block;background:linear-gradient(90deg,var(--red),var(--or));color:#fff;border:0;border-radius:12px;padding:10px 18px;font-family:Poppins;font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none}
.btn.alt{background:#fff;color:var(--deep)}
.btn.sm,.ghost.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.6}
.ghost{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);text-decoration:none;display:inline-block}
.x{background:none;border:0;color:var(--deep);cursor:pointer;font-size:12.5px;text-decoration:underline;margin-left:8px}
.badge{display:inline-block;background:#FFF1E6;color:var(--deep);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.badge.ok{background:#E7F6EA;color:#21733A}.badge.warn{background:#FFF4CC;color:#8a6500}
input,select,textarea{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink)}
textarea{width:100%;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--or);border-color:var(--or)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{flex:1;min-width:140px}
form#newth input,form#newtk input{width:100%;margin-bottom:8px}
form#newth textarea,form#newtk textarea{margin-bottom:8px}
/* hero */
.hero{border-radius:24px;background-size:cover;background-position:center;min-height:360px;display:flex;align-items:flex-end;margin-bottom:18px;overflow:hidden;position:relative}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,27,23,.05),rgba(43,27,23,.25) 40%,rgba(170,21,27,.92))}
.hero-in{position:relative;padding:30px 34px;color:#fff;max-width:720px}
.hero h1{font-size:52px;margin:6px 0}.hero h1 em{color:var(--gold);font-style:normal}
.kick{font-family:Poppins;font-size:12px;letter-spacing:.16em;text-transform:uppercase;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:999px}
.hero-b{display:flex;gap:10px;margin-top:14px}
.stat{text-align:center;font-size:14px;color:var(--mut)}.stat span{font-size:26px;display:block}.stat b{display:block;font-family:Poppins;font-size:34px;color:var(--red)}
.dates{list-style:none;padding:0;margin:0}.dates li{padding:6px 0 6px 12px;border-left:4px solid var(--or);margin-bottom:6px}
.dates li.cristiana{border-color:var(--deep)}.dates li.hispana{border-color:var(--gold)}
/* unidades */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ucard{border-radius:18px;min-height:220px;background-size:cover;background-position:center;position:relative;overflow:hidden;color:#fff;text-decoration:none;display:flex;align-items:flex-end}
.ucard:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(43,27,23,.85))}
.ucard>div{position:relative;padding:16px;width:100%}.ucard span{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-weight:700}
.ucard h3{font-size:22px;margin:2px 0}.ucard p{margin:0 0 8px;font-size:13.5px;opacity:.9}
.bar{height:6px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.uhead{border-radius:22px;min-height:230px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:12px}
.uhead:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(43,27,23,.82))}
.uhead>div{position:relative;color:#fff;padding:20px 26px}.uhead h1{font-size:40px;margin:0}.uhead span{color:var(--gold);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}.uhead small{opacity:.8}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;position:sticky;top:58px;z-index:5;background:var(--cream);padding:6px 0}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-family:inherit;font-size:14px}
.tabs button.act{background:var(--ink);color:#fff;border-color:var(--ink)}
.unav{display:flex;justify-content:space-between;margin-top:10px}
.big{font-family:Poppins;font-size:19px;font-weight:600}
.read p{font-family:"Lora",Georgia,serif;font-size:17px;line-height:1.75}
.read .src{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut)}
.gram table,.ubody .card table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14.5px}
.gram th,.ubody .card th{background:var(--red);color:#fff;text-align:left;padding:6px 8px;font-family:Poppins;font-weight:600;font-size:13.5px}
.gram td,.ubody .card td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
.ej{color:#9c3b10;font-style:italic}
.tip{background:#FFF7DA;border-left:5px solid var(--gold);padding:10px 14px;border-radius:0 12px 12px 0;margin-top:10px}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.vg{background:#FFF7F0;border-radius:12px;padding:10px 14px}.vg b{color:var(--deep);font-family:Poppins}.vg p{margin:4px 0 0}
.country{display:flex;gap:16px;align-items:center}.country svg{flex-shrink:0}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:10px}
figure{margin:0;background:#FFF7F0;border-radius:14px;overflow:hidden}figure img{width:100%;height:170px;object-fit:cover;display:block}figcaption{padding:8px 10px;font-size:13px}
/* fichas da apostila */
.fgrid{display:grid;gap:10px;margin-bottom:10px}.fcard{border:1.5px solid var(--c,#FB452F);border-radius:12px;overflow:hidden;margin-bottom:10px}
.fct{background:var(--c,#FB452F);color:#fff;font-family:Poppins;font-weight:600;font-size:14px;padding:5px 12px}
table.ft{width:100%;border-collapse:collapse;font-size:14px;margin:0!important}table.ft th{background:#FFF1E6!important;color:var(--ink)!important}
.fsub{font-family:Poppins;font-weight:600;font-size:13px;padding:4px 10px;color:var(--deep)}.fn{font-size:13px;padding:4px 10px;margin:0;color:var(--mut)}
.fl{margin:6px 0;padding:0 12px 0 28px}.fcard p{padding:4px 12px}
.tline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;text-align:center;font-size:13px}.tline span{background:#FFF4EA;border-radius:10px;padding:8px;border-top:4px solid var(--red)}
.box{border:1.5px solid var(--c,#FB452F);border-radius:12px;overflow:hidden;margin:8px 0}.box .bt{background:var(--c,#FB452F);color:#fff;font-family:Poppins;font-weight:600;padding:5px 12px;font-size:14px}.box .bc{padding:8px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* exercícios */
.ex{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 22px;margin-bottom:16px}
.ex-h{display:flex;justify-content:space-between;align-items:center;gap:10px}.ex-t{font-family:Poppins;font-weight:600;font-size:16px}
.ex-l{padding-left:22px;margin:10px 0}.ex-l li{margin:10px 0}
.inp{width:170px;margin:0 4px;padding:5px 8px}.inp.wide{width:100%;margin:6px 0 0}
.opts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px}.opts label{cursor:pointer;background:#FFF7F0;padding:4px 10px;border-radius:10px}
.opts.multi label{background:#fff;border:1.5px solid var(--line)}
.fb{display:block;font-size:13.5px;margin-top:3px}.fb.ok{color:#21733A}.fb.bad{color:#C0392B}.fb.half{color:#a26b00}
.ex-f{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px}
.score{display:flex;gap:12px;align-items:center;font-size:14px}
.nota{display:flex;align-items:baseline;gap:3px;border-radius:14px;padding:6px 12px;color:#fff;font-family:Poppins}.nota b{font-size:26px}.nota.good{background:#21733A}.nota.mid{background:#d18a00}.nota.low{background:#C0392B}
.sample{background:#F2FBF4;border-radius:10px;padding:10px;margin-top:10px}
/* áudio */
.audio{display:flex;gap:14px;background:linear-gradient(90deg,#2B1B17,#5a2a1c);color:#fff;border-radius:16px;padding:14px 18px;margin:10px 0}
.aud-ic{font-size:30px}.aud-b{flex:1}.aud-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.aud-ctl .small{color:#f1d9cc}.aud-ctl select{padding:3px 6px}
.play{background:var(--gold);border:0;border-radius:10px;padding:7px 14px;font-weight:700;cursor:pointer}.play.on{background:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,196,0,.35)}}
.trans{background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:14px}
/* dele */
.dtask{background:var(--deep);color:#fff;border-radius:12px;padding:8px 14px;margin:14px 0 8px}.dtask b{color:var(--gold);margin-right:6px}
.dtext{background:#FFFBF7;border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-family:Lora,Georgia,serif;font-size:15.5px}
.ads{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ad{background:#FFFBF7;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}.ad b{color:var(--deep)}
.people{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:8px 0}.people div{background:#FFF4D6;border-radius:10px;padding:6px 10px;font-size:14px}
.frags{columns:2;font-size:14.5px}.frags p{margin:3px 0;break-inside:avoid}
.lam{display:grid;grid-template-columns:1fr 1fr;gap:10px}.scene{border:1px solid var(--line);border-radius:12px;padding:10px;background:#FFFBF7}
table.tf{width:100%;border-collapse:collapse}table.tf td{padding:4px}
/* redação */
.list button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;cursor:pointer;font:inherit;font-size:14px}
.list button small{display:block;color:var(--mut);font-size:12px}.list button.act{background:#FFF1E6;font-weight:600}
.list{max-height:75vh;overflow:auto;padding:10px}
.task{background:#FFF7F0;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.wtext{font-family:Lora,Georgia,serif;font-size:16px;line-height:1.7;margin-top:10px}
.wfoot{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}.wfoot span:first-child{margin-right:auto;color:var(--mut);font-size:13px}
.file{display:inline-block;background:#FFF1E6;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:14px;text-decoration:none;color:var(--deep);margin:4px 4px 4px 0}.file input{display:none}
.sent{background:#E7F6EA;border-radius:12px;padding:10px 14px;margin:8px 0}.fbk{background:#fff;border-radius:10px;padding:8px 10px;margin-top:6px}
.crit summary{cursor:pointer;font-weight:600;color:var(--deep)}
/* mural */
.theme h2{margin-top:6px}.th-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.comments{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.cm{background:#FFF7F0;border-radius:14px;padding:8px 12px;margin:8px 0;max-width:85%}.cm.mine{background:#FFE9DD;margin-left:auto}.cm small{color:var(--mut);margin-left:8px;font-size:12px}.cm p{margin:4px 0 0}
.cform{display:flex;gap:8px;margin-top:10px}.cform textarea{flex:1}
/* mídia */
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin:10px 0}
.vid{text-decoration:none;color:var(--ink)}.vid .th{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:#222}.vid img{width:100%;height:100%;object-fit:cover;display:block}
.vid .th span{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;padding:1px 6px;border-radius:6px}
.vid .th i{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(251,69,47,.92);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:18px}
.vid b{display:block;margin-top:6px;font-size:14.5px}.vid small{color:var(--mut);font-size:12.5px}
.song,.film{display:flex;gap:12px;padding:10px;border-radius:12px;text-decoration:none;color:var(--ink);margin-bottom:6px;background:#FFFBF7}.song:hover{background:#FFF1E6}
.song>span,.film>span{font-size:24px}.song b,.film b{font-family:Poppins}.song small,.film small{display:block;color:var(--mut);font-size:12.5px}.song p,.film p{margin:2px 0 0;font-size:13.5px}.song.chr{background:#FCEEEE}
/* calendário */
.legend{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.legend span{padding:3px 10px;border-radius:999px;font-size:13px;border-left:6px solid}
.legend .cristiana,.ev.cristiana{border-color:var(--deep)}.legend .hispana,.ev.hispana{border-color:var(--gold)}.legend .cultural,.ev.cultural{border-color:var(--or)}.legend .yr{margin-left:auto;border:0}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.mon h3{text-transform:capitalize;color:var(--red)}
.ev{display:flex;gap:10px;border-left:5px solid;padding:4px 0 4px 10px;margin:8px 0}.ev b{font-family:Poppins;font-size:20px;min-width:26px}.ev span{font-weight:600;display:block}.ev small{color:var(--mut);font-size:12.5px}
/* gramática / verbos */
.vhead{font-size:16px;margin:12px 0}.vhead b:first-child{font-family:Poppins;font-size:26px;color:var(--red)}
.vtab{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.vtab div{background:#FFF7F0;border-radius:12px;padding:8px 12px}.vtab h4{margin:0 0 4px;color:var(--deep);font-size:14px}.vtab table{width:100%;font-size:14px}.vtab td:first-child{color:var(--mut);font-size:12.5px}
details.card summary{cursor:pointer;list-style:none}details.card summary h3{display:inline}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chips label{background:#FFF7F0;padding:4px 10px;border-radius:10px;font-size:14px;cursor:pointer}
.drill-opts{display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-bottom:12px}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;background:#FFF1E6;padding:7px 10px;font-family:Poppins;font-size:13.5px}.tbl td{padding:7px 10px;border-bottom:1px solid var(--line)}
.pl{padding:8px 0;border-bottom:1px solid var(--line)}
.sub{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}.sub.done{opacity:.7}.subtext{background:#FFFBF7;border-radius:10px;padding:10px;margin:8px 0;font-family:Lora,Georgia,serif}
.gform input[name=grade]{max-width:120px}
.login{text-align:center}.login form{display:flex;flex-direction:column;gap:10px;text-align:left;margin:16px 0}.login label{display:flex;flex-direction:column;font-weight:600;font-size:14px;gap:4px}
.lg{width:90px;margin:0 auto;display:block}.login h2 em{color:var(--red);font-style:normal}
.mail{font-size:22px;font-family:Poppins;font-weight:700}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;margin:10px auto}@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,40px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:99;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:#C0392B}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:98}#modal.show{display:flex}.mbox{background:#fff;border-radius:16px;padding:20px;max-width:400px;width:90%}.mbox input{width:100%;margin-bottom:10px}
@media (max-width:900px){
 #side{transform:translateX(-100%);transition:.2s}.nav-open #side{transform:none}
 #top,#main{margin-left:0}#menu{display:block}#main{padding:16px}
 .grid2,.grid3,.grid-side,.two,.vgrid,.gal,.ads,.people,.lam,.vtab{grid-template-columns:1fr}
 .hero h1{font-size:36px}.uhead h1{font-size:30px}.frags{columns:1}.levels .lv{padding:4px 9px}
}

.vid .th.ph{background:linear-gradient(135deg,#FB452F,#F26B21);display:flex;align-items:center;justify-content:center;aspect-ratio:16/9}
.vid .th.ph i{position:static;font-size:28px;color:#fff;font-style:normal}
.card.spot{background:linear-gradient(135deg,#1DB95422,#fff);border-left:5px solid #1DB954}
/* fotos completas, sin recortes */
.hero,.uhead{background-size:contain!important;background-repeat:no-repeat!important;background-position:right center!important;background-color:#2b1712}

function norm(s) { return String(s).toLowerCase().normalize("NFC").replace(/[.,;:¡!¿?«»"“”()]/g, " ").replace(/\s+/g, " ").trim(); }
function noAcc(s) { return s.replace(/ñ/g, "\u0001").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\u0001/g, "ñ"); }
function variants(a) { const v = [norm(a)]; if (/\(.*\)/.test(a)) { v.push(norm(a.replace(/\(.*?\)/g, ""))); v.push(norm(a.replace(/[()]/g, ""))); } return v; }

function speak(lines, rate, btn) {
  try {
    if (!("speechSynthesis" in window)) { toast("Tu navegador no tiene síntesis de voz. Lee la transcripción.", 1); return; }
    speechSynthesis.cancel(); loadVoices();
    const speakers = [...new Set(lines.map(l => l.sp).filter(Boolean))];
    const pref = TTS.voices.filter(v => /es-ES|es-MX|es-US|es-419|es-AR|es-CO/i.test(v.lang));
    const pool = pref.length ? pref : TTS.voices;
    let i = 0;
    const next = () => {
      if (i >= lines.length) { TTS.playing = false; if (btn) btn.classList.remove("on"); return; }
      const l = lines[i++]; const u = new SpeechSynthesisUtterance(l.t); u.lang = "es-ES"; u.rate = rate || 0.9;
      const si = Math.max(0, speakers.indexOf(l.sp));
      if (pool.length) u.voice = pool[si % pool.length];
      u.pitch = pool.length > 1 ? 1 : [1, 0.75, 1.25, 0.9][si % 4];
      u.onend = () => setTimeout(next, 280); u.onerror = () => next();
      speechSynthesis.speak(u);

  } catch (e) { toast("No se pudo reproducir el audio.", 1); }
}

function correct(id) {
  const e = EX[id], box = $("#ex-" + id); let s = 0, m = 0;
  const fb = (i, ok, sol) => { const f = box.querySelector(`[data-fb="${i}"]`); f.className = "fb " + (ok === 1 ? "ok" : ok === 0.5 ? "half" : "bad"); f.innerHTML = ok === 1 ? "✔" : ok === 0.5 ? `≈ ¡Ojo con las tildes! → <b>${sol}</b>` : `✘ <b>${sol}</b>`; };
  if (e.type === "fill" || e.type === "write") e.items.forEach((it, i) => { const v = box.querySelector(`input[data-i="${i}"]`).value; const r = check(v, it.a); s += r; m++; fb(i, r, it.a.join(" / ")); });
  else if (e.type === "mc" || e.type === "tf") e.items.forEach((it, i) => { const c = box.querySelector(`input[name="${id}-${i}"]:checked`); const right = e.type === "mc" ? it.c : (it.v ? 1 : 0); const r = c && +c.value === right ? 1 : 0; s += r; m++; fb(i, r, e.type === "mc" ? it.o[it.c] : (it.v ? "Verdadero" : "Falso")); });
  else if (e.type === "match") e.left.forEach((l, i) => { const v = box.querySelector(`select[data-i="${i}"]`).value; const r = v !== "" && +v === e.ans[i] ? 1 : 0; s += r; m++; fb(i, r, e.right[e.ans[i]]); });
  else if (e.type === "multi") { const ch = [...box.querySelectorAll("input:checked")].map(x => +x.value); let hits = 0; e.opts.forEach((o, j) => { const want = e.correct.includes(j), got = ch.includes(j); if (want === got) hits++; }); s = hits; m = e.opts.length; fb(0, hits === m ? 1 : 0, e.correct.map(j => e.opts[j]).join(", ")); }
  const sc = box.querySelector(`[data-score="${id}"]`);
  const g = grade10(s, m); const pct = m ? s / m : 0;

}
async function saveScore(id, s, m, title) {

function newDrill(key) {
  const box = $("#dr-" + key); let tenses = box.dataset.tenses ? box.dataset.tenses.split(",") : [...box.querySelectorAll(".chips input:checked")].map(x => x.value);

  let verbs = Object.keys(DATA.verbs).filter(v => set === "all" || (set === "irr" ? DATA.verbs[v].irr : !DATA.verbs[v].irr));
  if (tenses.includes("subj") || tenses.includes("imps") || tenses.includes("perf") || tenses.includes("plusc")) { }
  const P = ["yo", "tú", "él / ella / usted", "nosotros/as", "vosotros/as", "ellos / ellas / ustedes"];
  const tn = Object.fromEntries(DATA.tenses.map(([n, k]) => [k, n]));

    items.push({ q: `<b>${v}</b> · ${tn[t]} · <i>${P[p]}</i> → ___`, a: [DATA.verbs[v].t[t][p]] }); }

function fileInput(id) { return S.assets ? `<label class="file">📎 Adjuntar archivo<input type="file" data-file="${id}"></label><span class="small" data-fname="${id}"></span>` : ""; }
async function sendSub(id, title, text) {
  if (!S.db || !S.student) { toast("Entra con tu usuario para enviar.", 1); return; }
  const fileIn = document.querySelector(`input[data-file="${id}"]`); let files = [];
  try {
    if (fileIn && fileIn.files[0]) { toast("Subiendo archivo…"); const f = fileIn.files[0]; if (f.size > 20 * 1024 * 1024) { toast("El archivo es demasiado grande (máx. 20 MB).", 1); return; } const r = await S.assets.upload(f); files = [{ id: r.id, name: f.name }]; }
    const item = { text: text || "", title, files, at: Date.now(), level: S.student.level, grade: null, fb: "" };
    const ref = S.db.doc("subs/" + S.pid); const snap = await ref.get();
    const base = { name: S.student.name, user: S.student.user, level: S.student.level };
    if (snap.exists) await ref.update({ ...base, items: { [id]: item } }); else await ref.set({ ...base, items: { [id]: item } });
    S.subs[id] = item; ls("draft-" + id, null); toast("¡Enviado! Tu profesora lo corregirá pronto."); render();
  } catch (e) { writeFail(e); }
}

/* ============ Calendário ============ */
function easter(y) { const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1; return new Date(y, mo - 1, da); }
function datesFor(y) {
  const out = DATES.map(([m, d, t, ty, ds]) => ({ date: new Date(y, m - 1, d), title: t, type: ty, desc: ds }));
  const e = easter(y); MOVABLE.forEach(([off, t, ty, ds]) => out.push({ date: new Date(e.getFullYear(), e.getMonth(), e.getDate() + off), title: t, type: ty, desc: ds }));
  const xmas = new Date(y, 11, 25); const adv = new Date(y, 11, 25 - (xmas.getDay() || 7) - 21); out.push({ date: adv, title: "Primer domingo de Adviento", type: "cristiana", desc: "Comienzan las cuatro semanas de preparación para la Navidad." });
  const dec1 = new Date(y, 11, 1); const firstSun = 1 + ((7 - dec1.getDay()) % 7); out.push({ date: new Date(y, 11, firstSun + 7), title: "Día de la Biblia (Brasil)", type: "cristiana", desc: "Segundo domingo de diciembre: un día para agradecer la Palabra de Dios." });
  return out.sort((a, b) => a.date - b.date);
}
function upcoming(n) { const t = new Date(); t.setHours(0, 0, 0, 0); const y = t.getFullYear(); return datesFor(y).concat(datesFor(y + 1)).filter(d => d.date >= t).slice(0, n); }
function fmt(d) { return d.toLocaleDateString("es", { day: "numeric", month: "long" }); }
function calendar() {
  const y = S.calYear || new Date().getFullYear(); const ds = datesFor(y); const months = [...Array(12).keys()];
  return `<h1 class="pt">Calendario</h1><div class="card tint"><b>Próximas fechas:</b> ${upcoming(5).map(d => `${fmt(d.date)} · ${d.title}`).join(" — ")}</div>
   <div class="legend"><span class="cristiana">Fe cristiana</span><span class="hispana">Mundo hispano</span><span class="cultural">Cultura y lengua</span><span class="yr"><button class="ghost sm" data-year="${y - 1}">←</button> <b>${y}</b> <button class="ghost sm" data-year="${y + 1}">→</button></span></div>
   <div class="cal">${months.map(m => `<div class="card mon"><h3>${new Date(y, m, 1).toLocaleDateString("es", { month: "long" })}</h3>${ds.filter(d => d.date.getMonth() === m).map(d => `<div class="ev ${d.type}"><b>${d.date.getDate()}</b><div><span>${d.title}</span><small>${d.desc}</small></div></div>`).join("") || `<p class="small">—</p>`}</div>`).join("")}</div>
   <p class="small">Las fechas de Semana Santa, Pentecostés y Adviento se calculan automáticamente para cada año.</p>`;
}

  return `<h1 class="pt">Panel de la profesora</h1><div class="tabs">${[["alumnos", "👩‍🎓 Alumnos"], ["mural", "💬 Mural"], ["tareas", "📎 Tareas"], ["entregas", "📨 Entregas y notas"]].map(([k, t]) => `<button class="${ps === k ? "act" : ""}" data-ptab="${k}">${t}</button>`).join("")}</div>${b}
   <div class="card tint small"><b>Cómo dar acceso:</b> 1) crea el acceso del alumno en la página de inicio de la Jinas School, con su nivel; 2) envíale el correo y la contraseña provisional; 3) en el primer acceso el alumno crea su propia contraseña y ya ve su nivel.</div>`;
}
async function sha(s) { try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); } catch (e) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return "f" + (h >>> 0).toString(16) + s.length; } }
const keyOf = (u, p) => sha("ecf|" + u.trim().toLowerCase() + "|" + p);

/* ============ Render + eventos ============ */
function render() {
  if (!LVDATA[S.level]) { document.getElementById("app").innerHTML = `<div class="card center narrow" style="margin:60px auto"><h2>Cargando el nivel ${S.level}…</h2></div>`; loadLevel(S.level).then(() => { if (LVDATA[S.level]) render(); else { S.level = "B1"; render(); } }); return; }
  S.view = currentView(); stopSpeak();
  document.getElementById("app").innerHTML = shell();
  document.querySelectorAll("[data-wtext]").forEach(t => wc(t));
  window.scrollTo(0, 0);
}
function wc(t) { const n = t.value.trim() ? t.value.trim().split(/\s+/).length : 0; const el = document.querySelector(`[data-wc="${t.dataset.wtext}"]`); if (el) el.textContent = n + " palabras"; }
document.addEventListener("input", e => { const t = e.target; if (t.dataset && t.dataset.wtext) { wc(t); ls("draft-" + t.dataset.wtext, t.value); } });
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "verbsel") { S.verbSel = t.value; render(); }
  if (t.dataset.file) { const n = document.querySelector(`[data-fname="${t.dataset.file}"]`); if (n) n.textContent = t.files[0] ? t.files[0].name : ""; }
  if (t.dataset.stlevel) { try { await S.db.doc("students/" + t.dataset.stlevel).update({ level: t.value }); toast("Nivel actualizado."); } catch (er) { writeFail(er); } }
});
document.addEventListener("click", async e => {
  const t = e.target.closest("button, a, summary"); if (!t) return;
  const d = t.dataset;
  if (t.id === "menu") { document.body.classList.toggle("nav-open"); return; }
  if (t.closest("#side nav")) document.body.classList.remove("nav-open");
  if (d.level) { const can = S.teacher || (S.student && S.student.level === d.level); if (!can) { toast("Solo puedes entrar en tu nivel.", 1); return; } S.level = d.level; render(); return; }
  if (d.utab) { const [n, k] = d.utab.split(":"); S.unitTab[n] = k; render(); return; }
  if (d.check) { correct(d.check); return; }
  if (d.reset) { const box = $("#ex-" + d.reset); box.outerHTML = exHTML(EX[d.reset]); return; }
  if (d.sample) { $("#sm-" + d.sample).classList.toggle("hidden"); return; }
  if (d.play) { const a = AUDIOS[d.play]; const r = +document.querySelector(`[data-rate="${d.play}"]`).value; const c = document.querySelector(`[data-count="${d.play}"]`); if (c) c.textContent = +c.textContent + 1; speak(a.lines, r, t); return; }
  if ("stop" in d) { stopSpeak(); return; }
  if (d.trans) { $("#tr-" + d.trans).classList.toggle("hidden"); return; }
  if (d.speakread) { const u = DATA.units[+d.speakread - 1]; speak(u.reading.text.map(p => ({ sp: "", t: stripTags(p) })), 0.9, t); return; }
  if (d.drill) { newDrill(d.drill); return; }
  if (d.red) { S.redSel = d.red; render(); return; }
  if (d.send) { const ta = document.querySelector(`[data-wtext="${d.send}"]`); const fileIn = document.querySelector(`input[data-file="${d.send}"]`); if ((!ta || !ta.value.trim()) && !(fileIn && fileIn.files[0])) { toast("Escribe tu texto o adjunta un archivo.", 1); return; } t.disabled = true; await sendSub(d.send, d.title, ta ? ta.value : ""); t.disabled = false; return; }
  if (d.year) { S.calYear = +d.year; render(); return; }
  if (d.ptab) { S.panelTab = d.ptab; render(); return; }
  if (d.delc) { const [p, c] = d.delc.split("|"); await delComment(p, c); return; }
  if (d.thdel) { if (await confirmBox("¿Eliminar este tema del mural?")) try { await S.db.doc("themes/" + d.thdel).delete(); } catch (er) { writeFail(er); } return; }
  if (d.tkdel) { if (await confirmBox("¿Eliminar esta tarea?")) try { await S.db.doc("tasks/" + d.tkdel).delete(); } catch (er) { writeFail(er); } return; }
  if (d.stdel) { if (await confirmBox("¿Eliminar este alumno? Ya no podrá entrar.")) try { await S.db.doc("students/" + d.stdel).delete(); toast("Alumno eliminado."); } catch (er) { writeFail(er); } return; }
  if (d.stpass) { const s = S.students.find(x => x.key === d.stpass); const np = await promptBox(`Nueva contraseña para ${s.name}:`); if (!np) return; try { const k = await keyOf(s.user, np); const { key, ...body } = s; await S.db.doc("students/" + k).set(body); await S.db.doc("students/" + s.key).delete(); toast("Contraseña cambiada. El alumno debe entrar de nuevo."); } catch (er) { writeFail(er); } return; }
  if (t.id === "logout") { try { if (S.db && S.pid) await S.db.doc("links/" + S.pid).delete(); } catch (er) { } S.student = null; ls("progress", {}); S.progress = {}; S.subs = {}; render(); return; }
});
document.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target; const fd = Object.fromEntries(new FormData(f));
  if (f.id === "loginf") {
    if (!S.db || !S.pid) { toast("No hay conexión con la plataforma.", 1); return; }
    const k = await keyOf(fd.u, fd.p);
    try { const snap = await S.db.doc("students/" + k).get(); if (!snap.exists) { toast("Usuario o contraseña incorrectos.", 1); return; }
      await S.db.doc("links/" + S.pid).set({ key: k, at: Date.now() }); await loadStudent(k); toast("¡Hola, " + S.student.name + "!"); } catch (er) { writeFail(er); }
    return;
  }
  if (f.id === "newst") { const k = await keyOf(fd.user, fd.pass); if (S.students.some(s => s.user.toLowerCase() === fd.user.trim().toLowerCase())) { toast("Ese usuario ya existe.", 1); return; }
    try { await S.db.doc("students/" + k).set({ name: fd.name.trim(), user: fd.user.trim().toLowerCase(), level: fd.level, created: Date.now() }); f.reset(); toast("Alumno creado: " + fd.name); } catch (er) { writeFail(er); } return; }
  if (f.id === "newth") { try { await S.db.collection("themes").add({ title: fd.title, text: fd.text, level: fd.level, at: Date.now() }); f.reset(); toast("Tema publicado."); } catch (er) { writeFail(er); } return; }
  if (f.id === "newtk") { try { await S.db.collection("tasks").add({ title: fd.title, text: fd.text, level: fd.level, at: Date.now() }); f.reset(); toast("Tarea publicada."); } catch (er) { writeFail(er); } return; }
  if (f.classList.contains("cform")) { const tx = f.querySelector("textarea").value.trim(); if (!tx) return; await postComment(f.dataset.theme, tx); f.reset(); return; }
  if (f.classList.contains("gform")) { const [pid, k] = f.dataset.sub.split("|"); const g = fd.grade === "" ? null : Math.max(0, Math.min(10, +fd.grade));
    try { await S.db.doc("subs/" + pid).update({ items: { [k]: { grade: g, fb: fd.fb || "" } } }); toast("Nota guardada."); } catch (er) { writeFail(er); } return; }
});
function confirmBox(msg) { return new Promise(res => { const m = $("#modal"); m.innerHTML = `<div class="mbox"><p>${msg}</p><div class="row"><button class="ghost" id="mno">Cancelar</button><button class="btn" id="mok">Sí</button></div></div>`; m.className = "show"; $("#mno").onclick = () => { m.className = ""; res(false); }; $("#mok").onclick = () => { m.className = ""; res(true); }; }); }
function promptBox(msg) { return new Promise(res => { const m = $("#modal"); m.innerHTML = `<div class="mbox"><p>${msg}</p><input id="min"><div class="row"><button class="ghost" id="mno">Cancelar</button><button class="btn" id="mok">Guardar</button></div></div>`; m.className = "show"; $("#mno").onclick = () => { m.className = ""; res(null); }; $("#mok").onclick = () => { const v = $("#min").value.trim(); m.className = ""; res(v || null); }; }); }

/* ============ Dados (db) ============ */
let rerenderT; function soft(views) { if (views && !views.some(v => S.view === v || S.view.startsWith(v))) return; clearTimeout(rerenderT); rerenderT = setTimeout(() => { const a = document.activeElement; if (a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "radio" && a.type !== "checkbox"))) return; render(); }, 150); }
function sub(q, fn) { let last = null; try { q.onSnapshot(snap => { const j = JSON.stringify(snap.docs ? snap.docs.map(d => [d.id, d.data()]) : [snap.exists, snap.data && snap.data()]); if (j === last) return; last = j; fn(snap); }, () => { }); } catch (e) { } }
async function loadStudent(key) {
  const snap = await S.db.doc("students/" + key).get();
  if (!snap.exists) { S.student = null; try { await S.db.doc("links/" + S.pid).delete(); } catch (e) { } render(); return; }
  S.student = { key, ...snap.data() }; S.level = S.student.level;
  sub(S.db.doc("students/" + key), s => { if (!s.exists) { S.student = null; render(); return; } S.student = { key, ...s.data() }; if (!S.teacher) S.level = S.student.level; soft(["inicio"]); });
  sub(S.db.doc("progress/" + S.pid), s => { if (s.exists) { const sc = s.data().scores || {}; S.progress = { ...S.progress, ...sc }; soft(["notas", "unidades", "inicio"]); } });
  sub(S.db.doc("subs/" + S.pid), s => { S.subs = s.exists ? structuredClone(s.data().items || {}) : {}; soft(["notas", "redaccion", "tareas", "unidad"]); });
  render();
}
async function connect() {
  S.progress = ls("progress") || {};
  try {
    const [user, db] = await Promise.all([window.claude?.use("user"), window.claude?.use("db")]);
    S.user = user; S.db = db;
    try { S.assets = await window.claude?.use("assets"); } catch (e) { S.assets = null; }
    if (user) { S.teacher = !!user.isOwner(); try { S.pid = await user.id(); } catch (e) { } }
    if (db) {
      sub(db.collection("themes"), s => { S.themes = s.docs.map(d => ({ id: d.id, ...d.data() })); soft(["mural", "inicio", "profesora"]); });
      sub(db.collection("tasks"), s => { S.tasks = s.docs.map(d => ({ id: d.id, ...d.data() })); soft(["tareas", "profesora"]); });
      sub(db.collection("comments"), s => { S.comments = s.docs.flatMap(d => Object.entries(d.data().items || {}).map(([cid, c]) => ({ pid: d.id, cid, ...c }))); soft(["mural", "profesora"]); });
      if (S.teacher) {
        sub(db.collection("students"), s => { S.students = s.docs.map(d => ({ key: d.id, ...d.data() })); soft(["profesora"]); });
        sub(db.collection("progress"), s => { S.allProgress = s.docs.map(d => ({ pid: d.id, ...d.data() })); soft(["profesora"]); });
        sub(db.collection("subs"), s => { S.allSubs = s.docs.map(d => ({ pid: d.id, ...d.data() })); soft(["profesora"]); });
      } else if (S.pid) {
        const l = await db.doc("links/" + S.pid).get(); if (l.exists) await loadStudent(l.data().key);
      }
    }
  } catch (e) { console.log(e); }
  S.ready = true; render();
}
render();
setTimeout(() => { if (!S.ready) { S.ready = true; render(); } }, 10000);
connect();
